services:
  postgres:
    image: postgres:16-alpine
    container_name: ash_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ash
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ash_holding
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [ash_net]

  redis:
    image: redis:7-alpine
    container_name: ash_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks: [ash_net]

  backend:
    build: ./backend
    container_name: ash_backend
    restart: unless-stopped
    env_file: ./backend/.env
    depends_on: [postgres, redis]
    volumes:
      - uploads:/data/uploads
    networks: [ash_net]

  frontend:
    build: .
    container_name: ash_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
    depends_on: [backend]
    networks: [ash_net]

  nginx:
    image: nginx:1.27-alpine
    container_name: ash_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on: [frontend, backend]
    networks: [ash_net]

volumes:
  postgres_data:
  redis_data:
  uploads:

networks:
  ash_net:
    driver: bridge
