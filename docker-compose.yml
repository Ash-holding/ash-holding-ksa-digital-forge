services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ash}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ashpass}
      POSTGRES_DB: ${POSTGRES_DB:-ash_holding}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # ports:                # uncomment to expose DB to host during development
    #   - "5432:5432"

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ash}:${POSTGRES_PASSWORD:-ashpass}@postgres:5432/${POSTGRES_DB:-ash_holding}?schema=public
      NODE_ENV: production
      PORT: 4000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-30}
      COOKIE_SECRET: ${COOKIE_SECRET}
      UPLOAD_DIR: /app/uploads
      UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-25}
      UPLOAD_ALLOWED_MIME: ${UPLOAD_ALLOWED_MIME:-}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@ashholding.sa}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin@12345}
      SEED_CLIENT_EMAIL: ${SEED_CLIENT_EMAIL:-client@demo.sa}
      SEED_CLIENT_PASSWORD: ${SEED_CLIENT_PASSWORD:-Client@12345}
    volumes:
      - uploads:/app/uploads

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-/api}
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      # - "443:443"       # enable with your certs mounted below
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - uploads:/var/www/uploads:ro
      # - ./certs:/etc/nginx/certs:ro

volumes:
  pgdata:
  uploads:
