worker_processes  auto;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile        on;
  keepalive_timeout  65;
  client_max_body_size 30m;   # match UPLOAD_MAX_MB
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

  # backend upstream
  upstream ash_backend  { server backend:4000; }
  upstream ash_frontend { server frontend:3000; }

  # Never cache HTML/SSR responses at proxy or browser — this is what forces
  # clients to fetch the fresh index shell that references the new hashed
  # asset filenames after every deploy.
  map $sent_http_content_type $no_cache_html {
    default        0;
    "~*text/html"  1;
  }

  server {
    listen 80 default_server;
    server_name _;

    # Uploaded files served directly by nginx from the shared volume
    location /uploads/ {
      alias /var/www/uploads/;
      access_log off;
      expires 7d;
      add_header Cache-Control "public, max-age=604800, immutable" always;
    }

    location /api/ {
      proxy_pass         http://ash_backend;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
      add_header Cache-Control "no-store" always;
    }

    location /health {
      proxy_pass http://ash_backend/health;
    }

    # Hashed, immutable build assets (Vite/Nitro fingerprinted output).
    # The filename changes on every deploy, so 1-year immutable cache is safe
    # and gives instant loads for repeat visitors.
    location ~* ^/(_build|assets|_nuxt|_server)/ {
      proxy_pass         http://ash_frontend;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      access_log off;
    }

    # Non-hashed static files at the root (favicon, robots, sitemap, og-image…).
    # Short cache with must-revalidate so a redeploy overrides them within a day.
    location ~* \.(ico|png|jpe?g|gif|webp|avif|svg|woff2?|ttf|otf|eot|mp4|webm|txt|xml|json)$ {
      proxy_pass         http://ash_frontend;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      add_header Cache-Control "public, max-age=86400, must-revalidate" always;
    }

    # SSR HTML routes — always revalidate so a newly deployed page (e.g.
    # /client/projects/new) appears immediately, no hard-refresh required.
    location / {
      proxy_pass         http://ash_frontend;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;

      proxy_no_cache     $no_cache_html;
      proxy_cache_bypass $no_cache_html;
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      add_header Pragma "no-cache" always;
      add_header Expires "0" always;
    }
  }

  # ---- HTTPS example (uncomment after you have certs mounted at /etc/nginx/certs) ----
  # server {
  #   listen 443 ssl http2;
  #   server_name your-domain.com;
  #   ssl_certificate     /etc/nginx/certs/fullchain.pem;
  #   ssl_certificate_key /etc/nginx/certs/privkey.pem;
  #   # ... same location blocks as above ...
  # }
}
