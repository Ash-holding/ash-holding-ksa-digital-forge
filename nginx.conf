worker_processes  auto;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile        on;
  keepalive_timeout  65;
  client_max_body_size 30m;   # match UPLOAD_MAX_MB
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

  # backend upstream
  upstream ash_backend  { server backend:4000; }
  upstream ash_frontend { server frontend:3000; }

  server {
    listen 80 default_server;
    server_name _;

    # Uploaded files served directly by nginx from the shared volume
    location /uploads/ {
      alias /var/www/uploads/;
      access_log off;
      expires 7d;
    }

    location /api/ {
      proxy_pass         http://ash_backend;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }

    location /health {
      proxy_pass http://ash_backend/health;
    }

    location / {
      proxy_pass         http://ash_frontend;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }
  }

  # ---- HTTPS example (uncomment after you have certs mounted at /etc/nginx/certs) ----
  # server {
  #   listen 443 ssl http2;
  #   server_name your-domain.com;
  #   ssl_certificate     /etc/nginx/certs/fullchain.pem;
  #   ssl_certificate_key /etc/nginx/certs/privkey.pem;
  #   # ... same location blocks as above ...
  # }
}
