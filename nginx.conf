worker_processes auto;
events { worker_connections 1024; }

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  client_max_body_size 25m;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

  upstream ash_frontend { server frontend:3000; }
  upstream ash_backend  { server backend:4000; }

  # HTTP -> HTTPS (uncomment after certs are in place)
  # server {
  #   listen 80;
  #   server_name ashholding.sa www.ashholding.sa;
  #   return 301 https://$host$request_uri;
  # }

  server {
    listen 80 default_server;
    # listen 443 ssl http2;
    server_name _;

    # ssl_certificate     /etc/nginx/certs/fullchain.pem;
    # ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # API
    location /api/ {
      proxy_pass         http://ash_backend;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Frontend (SSR)
    location / {
      proxy_pass         http://ash_frontend;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        "upgrade";
    }
  }
}
