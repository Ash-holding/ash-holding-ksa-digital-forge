name: Build & Deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy on server
    runs-on: ubuntu-latest
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.event_name == 'workflow_dispatch'
    steps:
      - name: Trigger remote build & deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 10m
          script: |
            set -e
            export PATH="$HOME/.bun/bin:$PATH"
            cd ${{ secrets.DEPLOY_PATH }}
            echo ">> git pull"
            git fetch --all
            git reset --hard origin/$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo main)
            echo ">> frontend install + build"
            bun install --frozen-lockfile
            echo ">> clean previous output to avoid stale chunks"
            rm -rf .output .nitro dist node_modules/.vite node_modules/.cache
            VITE_API_URL="${{ secrets.VITE_API_URL }}" bun run build
            SERVER_ENTRY=""
            for candidate in dist/server/index.mjs .output/server/index.mjs; do
              if [ -f "$candidate" ]; then SERVER_ENTRY="$candidate"; break; fi
            done
            if [ -z "$SERVER_ENTRY" ]; then
              echo "!! build did not produce a server entry (dist/server/index.mjs or .output/server/index.mjs) — aborting deploy"
              exit 1
            fi
            if [ -d backend ]; then
              echo ">> backend install + build"
              cd backend
              npm ci --no-audit --no-fund
              npx prisma generate
              npx prisma migrate deploy || npx prisma db push --accept-data-loss --skip-generate || true
              npm run build
              pm2 reload ashholding-api || pm2 start dist/server.js --name ashholding-api
              cd ..
            fi
            echo ">> reload web"
            if ! pm2 describe ashholding-web >/dev/null 2>&1 || ! pm2 reload ashholding-web >/dev/null 2>&1; then
              pm2 delete ashholding-web >/dev/null 2>&1 || true
              PORT=3000 HOST=127.0.0.1 pm2 start .output/server/index.mjs --name ashholding-web
            fi
            pm2 save || true
            sudo systemctl reload nginx || true
            echo ">> done"
