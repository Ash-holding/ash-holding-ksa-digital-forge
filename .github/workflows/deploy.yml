name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy on server
    runs-on: ubuntu-latest
    steps:
      - name: Trigger remote build & deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 10m
          script: |
            set -e
            export PATH="$HOME/.bun/bin:$PATH"
            cd ${{ secrets.DEPLOY_PATH }}
            echo ">> git pull"
            git fetch --all
            git reset --hard origin/main
            echo ">> frontend install + build"
            bun install --frozen-lockfile
            VITE_API_URL="${{ secrets.VITE_API_URL }}" bun run build
            if [ -d backend ]; then
              echo ">> backend install + build"
              cd backend
              npm ci --no-audit --no-fund
              npx prisma generate
              npx prisma migrate deploy || npx prisma db push --accept-data-loss --skip-generate || true
              npm run build
              pm2 reload ashholding-api || pm2 start dist/server.js --name ashholding-api
              cd ..
            fi
            echo ">> reload web"
            pm2 reload ashholding-web || PORT=3000 HOST=127.0.0.1 pm2 start .output/server/index.mjs --name ashholding-web
            pm2 save || true
            sudo systemctl reload nginx || true
            echo ">> done"
